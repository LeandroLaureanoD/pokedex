<ion-header>
  <ion-toolbar>
    <ion-title>Pokédex</ion-title>
  </ion-toolbar>
</ion-header>

<ion-searchbar placeholder="Buscar Pokémon" (ionInput)="buscarPokemon($event)">
</ion-searchbar>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      @for (pokemon of pokemonsFiltrados; track pokemon.name) {
      <ion-col size="6" size-md="4" size-lg="3">
        <ion-card (click)="abrirDetalhes(pokemon.id)">
          <ion-img [src]="pokemon.imageUrl" [alt]="pokemon.name">
          </ion-img>
          <ion-card-header>
            <ion-card-title>
              {{ pokemon.name }}
            </ion-card-title>
          </ion-card-header>
        </ion-card>
      </ion-col>
      }
    </ion-row>
  </ion-grid>
</ion-content>
